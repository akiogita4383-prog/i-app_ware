  <path d="M35 28 Q35 14 50 14 Q65 14 65 28" stroke="#c0a882" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <!-- bag body -->
  <rect x="14" y="28" width="72" height="58" rx="6" fill="#ede0cc" stroke="#c0a882" stroke-width="1.5"/>
  <!-- bag top flap shadow -->
  <path d="M14 28 L86 28 L86 42 Q50 48 14 42 Z" fill="#e0d0b8" opacity="0.5"/>
