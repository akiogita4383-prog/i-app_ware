  <rect x="42" y="38" width="16" height="10" rx="3" fill="#c8a870" stroke="#b89858" stroke-width="1"/>
  <circle cx="50" cy="43" r="3" fill="#b89858"/>
  <!-- pocket stitch lines -->
  <rect x="20" y="52" width="60" height="28" rx="4" stroke="#c0a882" stroke-width="0.8" stroke-dasharray="3,2"/>
  <!-- bottom shadow -->
